# Build the CLI for main branch and pull_request pushes.
# Runs the unit tests

name: Build

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Build
        run: make cli
      - name: Upload binary
        uses: actions/upload-artifact@v5
        with:
          name: relacs
          path: bin/relacs-*
          retention-days: 1

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Unit test
        run: make unit-test

  release:
    needs: [build, lint, test]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: Download binary
        uses: actions/download-artifact@v7
        with:
          name: relacs
      - name: Show binaries
        run: ls -la .
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          tag_name: ${{ github.ref_name }}
          files: |
            relacs-darwin-amd64
            relacs-darwin-arm64
            relacs-linux-amd64
            relacs-linux-arm64
