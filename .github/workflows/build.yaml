# Build the CLI for main branch and pull_request pushes.
# Runs the unit tests

name: Build

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build
        run: make cli
      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: relacs
          path: bin
          retention-days: 1

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9

  unit-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Unit test
        run: make unit-test

  e2e-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: E2E test
        run: make e2e-test

  release:
    needs: [build, lint, unit-test, e2e-test]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: Download binary
        uses: actions/download-artifact@v8
        with:
          name: relacs
          path: bin
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          tag_name: ${{ github.ref_name }}
          files: bin/*
